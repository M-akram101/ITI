<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course List</title>
  </head>
  <body>
    <h2>Course List</h2>
    <table border="1">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for course in courses %}
        <tr>
          <td>{{ course.id }}</td>
          <td>{{ course.name }}</td>
          <td>
            <a href="{% url 'course_update' course.id %}">Edit</a> |
            <form
              action="{% url 'course_delete' course.id %}"
              method="POST"
              style="display: inline"
            >
              {% csrf_token %}
              <button type="submit">Delete</button>
            </form>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="4">No courses found.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <br />
    <a href="{% url 'course_create' %}">Add New Course</a>
  </body>
</html>
