<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trainee Form</title>
  </head>
  <body>
    <h2>{% if form.instance.pk %}Edit{% else %}Create{% endif %} Trainee</h2>
    <form method="post">
      {% csrf_token %}
      <table>
        {{ form.as_table }}
      </table>
      <button type="submit">Save</button>
    </form>
    <br />
    <a href="{% url 'get_all_trainees' %}">Back to List</a>
  </body>
</html>
